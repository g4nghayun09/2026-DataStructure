<html>

<head>
    <title>배열 - 점수 카운팅</title>
</head>

<body>
    <script>
        function solution(arr) {
            let answer = 0;
            let cnt = 1;
            // cnt를 0으로 하면 cnt++;을 answer+= 하기 전에 먼저 하면 됨.
            // cnt를 1으로 하면 cnt++을 answer+= 한 후에 하면 됨.
            
            // for(let i of arr) {
            for(let i=0; i<arr.length; i++) {
                if(arr[i] === 1) {
                    answer += cnt;
                    cnt++;
                }
                // else {
                if(arr[i]===0) {
                    cnt = 1;
                }
            }
            return answer;
        }
        let arr = [1, 0, 1, 1, 1, 0, 0, 1, 1, 0];
        console.log(solution(arr));
    </script>
</body>

</html>

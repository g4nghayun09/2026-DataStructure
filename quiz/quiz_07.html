<body>
    <script>
        function solution(arr, moves) {
            let answer = 0;
            let stk = [];
            // console.log(arr[3][0]);
            for(let i=0; i<moves.length; i++) {
                for(let j=0; j<arr.length; j++) {
                    if(arr[j][moves[i]-1] != 0) {
                        if(stk[stk.length-1]==arr[j][moves[i]-1]) {
                            stk.pop();
                            answer+=2;
                        }
                        else {
                            stk.push(arr[j][moves[i]-1]);
                        }
                        
                        // stk.push(arr[j][moves[i]-1]);
                        //console.log(moves[i]-1);
                        arr[j][moves[i]-1] = 0;
                        break;
                    }
                }
                //console.log(stk);
            }
            return answer;
        }
        let arr = [
        [0, 0, 0, 0, 0],
        [0, 0, 1, 0, 3],
        [0, 2, 5, 0, 1],
        [4, 2, 4, 4, 1],
        [3, 5, 1, 3, 1]];

        let moves = [1, 5, 3, 5, 1, 2, 1, 4];
        console.log(solution(arr, moves));
    </script>
</body>

</html>

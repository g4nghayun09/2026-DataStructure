<html>

<head>
    <title>좌표 정렬</title>
</head>

<body>
    <script>
        /*
        N개의 평면상의 좌표(x, y)가 주어지면 모든 좌표를 오름차순으로
        정렬하는 프로그램을 작성하시오.
        */
        function solution(arr) {
            let answer;

            answer = arr.sort((a, b) => {
                return a[0] - b[0];
            })

            for (let i = 0; i < answer.length - 1; i++) {
                if (answer[i][0] == answer[i + 1][0] && answer[i][1] > answer[i + 1][1]) {
                    let temp = answer[i][1];
                    answer[i][1] = answer[i + 1][1];
                    answer[i + 1][1] = temp;
                }
            }
            
            return answer;
        }
        let arr = [[2, 7], [1, 3], [1, 2], [2, 5], [3, 6]];
        console.log(solution(arr));
    </script>
</body>

</html>

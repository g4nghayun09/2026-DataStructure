<html>

<head>
    <title>stack - 괄호 맞춤법 검사기</title>
</head>

<body>
    <script>
        function solution(s) {
            let answer = "YES";
            let arr = [];
            for(let i=0; i<s.length; i++) {
                if(s[i]==="(") {
                    arr.push(i);
                }
                else if(arr.length===0 && s[i]===")"){
                    return "NO";
                }
                else {
                    arr.pop();
                }
            } // for
            if(arr.length>0){
                return "NO";
            }

            return answer;
        }
        let a = "(()())";
        console.log(solution(a));
    </script>
</body>

</html>

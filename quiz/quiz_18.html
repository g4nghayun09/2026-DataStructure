<html>

<head>
    <title>그래프 경로 탐색 - 인접리스트</title>
</head>

<body>
    <script>
        function solution(n, arr) {
            let answer = 0;
            let graph = Array.from(Array(n+1), () => Array(1));
            let ch = Array.from({ length: n + 1 }, () => 0);
            // console.log(graph);

            for (let [a, b] of arr) {
                graph[a].push(b);
            }
            // console.log(graph);

            function DFS(v) {
                if (v === n) {
                    answer++;
                }
                else {
                    for (let i = 0; i < n; i++) {
                        ch[i] = 1;
                        DFS(graph[i]);
                        ch[i] = 0;
                    }
                }
            }

            DFS(1);

            return answer;
        }
        let arr = [
            [1, 2],
            [1, 3],
            [1, 4],
            [2, 1],
            [2, 3],
            [2, 5],
            [3, 4],
            [4, 2],
            [4, 5],
        ];
        console.log(solution(5, arr));
    </script>
</body>

</html>

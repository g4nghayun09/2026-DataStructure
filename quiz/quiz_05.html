<html>

<head>
    <title>stack - 괄호 안에 있는 문자열 제거</title>
</head>

<body>
    <script>
        function solution(s) {
            let answer = "";
            let stack = [];

            for(let i=0; i<s.length; i++) {
                if(s[i]===")") {
                    while(stack.pop()!=="("); 
                }
                else{
                    stack.push(s[i]);           
                }
            }
            answer = stack.join('');
            return answer;
        }
        let str = "(A(BC)D)EF(G(H)(IJ)K)LM(N)";
        console.log(solution(str));
    </script>
</body>

</html>

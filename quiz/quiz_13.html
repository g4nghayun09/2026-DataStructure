            let answer = "";
            

            function Traversal(v) {
                if(v>7) return;

                let l = v*2;
                let r = (v*2)+1;

                // preorder
                
                answer += v;
                Traversal(l);
                Traversal(r);
                

                // inorder
                answer += v;
                Traversal(l);
                Traversal(r);

                // postorder
           


            } // Traversal
            Traversal(1);

            return answer;
        }

        console.log(solution(1));

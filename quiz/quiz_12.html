    <script>
        function solution(times) {
            // let answer = 0;

            // for(let x of times) {

            // for(let x of time) {
            //     if(x>answer) {
            //         answer = x;
            //     }
            //     // console.log(x);
            // }
            // return answer;
            let answer = 0;
            let timeLine = [];

            for (let x of times) {
                // console.log(x);
                timeLine.push([x[0], 's']);
                timeLine.push([x[1], 'e']);
            }
            timeLine.sort((a, b) => {
                // 시간이 같을 때만 퇴장('e')이 입장('s')보다 먼저 오도록 정렬
                if (a[0] === b[0]) return a[1].charCodeAt() - b[1].charCodeAt(); 
                return a[0] - b[0]; // a[0] == a[0] 오류 수정
            });
            // console.log(timeLine);
            let cnt = 0;
            for (let x of timeLine) {
                if (x[1] == 's') cnt++;
                else cnt--;
                answer = Math.max(answer, cnt);
            }

            return answer;
        }
        let arr = [[14, 18], [12, 15], [15, 20], [20, 30], [5, 14]];
        console.log(solution(arr));

<html>

<head>
    <title>Array 내장함수 정리</title>
</head>

<body>
    <div id="div1"></div>

    <script>
        // toString() : 쉼표를 구분자로 해서 문자열로 변환
        var fruits1 = ["Banana", "Orange", "Apple"];
        console.log(fruits1.toString());

        // join() - 특정 문자를 구분자로 해서 문자열로 반환 가능
        console.log(fruits1.join("|"));

        // join() 응용
        var txt1 = "Banana";
        txt1 += "Orange";
        txt1 += "Apple";
        console.log(txt1);

        document.getElementById("div1").innerHTML = txt1;

        var arr = [];
        arr.push("Banana");
        arr.push("Orange");
        arr.push("Apple");

        console.log(arr);
        document.getElementById("div1").innerHTML = arr.join("<br>");

        // pop() : 배열의 가장 마지막 항복을 제거하여 리턴 - Stack 구현
        var fruits2 = ["Banana", "Orange", "Apple"];
        var str = fruits2.pop();
        console.log(str);
        console.log(fruits2);

        // push() : 배열의 가장 마지막에 새로운 항목을 추가 - stack 구현
        fruits2.push("Lemon");
        console.log(fruits2);

        // shift() : 배열의 첫번째 항목을 제거하여 리턴함 - Queue 구현
        var fruits3 = ["Banana", "Orange", "Apple"];
        var str = fruits3.shift();
        console.log(str);
        console.log(fruits3);

        // unshift() : 배열의 첫번째에 새로운 항목을 추가 - Queue 구현
        var fruits4 = ["Banana", "Orange", "Apple"];
        var str = fruits4.unshift("Kiwi");
        console.log(fruits4);

        // ***** 중요 ***** Deque : pop(), push(), shift(), unshift()
        fruits4[0] = "Grape";
        console.log(fruits4);

        fruits4[fruits4.length - 1] = "Peach";
        console.log(fruits4);

        // splice(a, b, c) : 배열의 중간에 삽입 또는 삭제가 가능
        // a : 시작 index
        // b : 삭제할 항목의 수
        // c : 삽입할 항목
        var fruits5 = ["Banana", "Orange", "Apple"];
        fruits5.splice(1, 2); // 1번 인덱스에서 2개 삭제
        console.log(fruits5); // Banana
        fruits5.splice(1, 0, "Lemon", "Kiwi");

        // concat() : 두 개의 배열을 하나로 합쳐줌
        var BTS1 = ["뷔"];
        var BTS2 = ["정국", "RM", "슈가"];
        var BTS = BTS1.concat(BTS2);
        console.log(BTS);

        // slice(a, b) : a부터 b-1까지 항목을 가져옴
        var fruits6 = ["Banana", "Orange", "Apple"];
        var fruits7 = fruits6.slice(1, 2);
        var fruits7 = fruits6.slice(1, 3);
        var fruits7 = fruits6.slice(1);

        console.log(fruits7);

        // sort() : 정렬(오름차순, 내림차순)
        var fruits8 = ["Banana", "Orange", "Apple", "Lemon", "Kiwi"];
        console.log(fruits8.sort());

        var points = [40, 100, 70, 21, 99];
        console.log(points.sort());

        points.sort(function (a, b) {
            if (a > b) { return -1; }
            else if (a < b) { return 1; }
            return 0;
        });
        console.log(points);

        points.sort(function(a,b) {
            return a-b;
        });
        console.log(points);

        console.log(points.reverse());

        // object 정렬


    </script>
</body>

</html>
